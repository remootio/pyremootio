[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyremootio"
dynamic = ["version"]
description = "Async Python client for the Remootio Websocket API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Remootio", email = "hello@remootio.com" },
]
keywords = ["remootio", "asyncio", "garage", "gate", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/remootio/pyremootio"
Documentation = "https://github.com/remootio/remootio-api-documentation"
Source = "https://github.com/remootio/pyremootio"
Issues = "https://github.com/remootio/pyremootio/issues"

[tool.hatch.version]
path = "src/pyremootio/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PERF",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["pyremootio"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pyremootio"]
